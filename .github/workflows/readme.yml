name: Update readme

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate readme SVGs
        run: node build-svg.js

      - name: Commit & Push updated SVGs
        uses: EndBug/add-and-commit@v9
        with:
          author_name: MANZI SHIMWA Yves Seraphin
          author_email: myvesseraphin@gmail.com
          message: "Auto updating README SVGs"
          add: "*.svg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "README workflow failed" \
            --body "The daily README update workflow failed. [View the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
