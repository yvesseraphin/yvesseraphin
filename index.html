<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seraphin GitHub README</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
    }

    img {
      width: min(550px, calc(100vw - 24px));
      height: auto;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0d1117;
      }
    }
  </style>
</head>

<body>
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="chat-dark.svg" />
    <source media="(prefers-color-scheme: light)" srcset="chat.svg" />
    <img src="chat.svg" alt="Animated chat bubbles introducing Seraphin" />
  </picture>
</body>

</html>
